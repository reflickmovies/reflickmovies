name: Keep API Alive

on:
  schedule:
    # Pings every 10 min from 05:00 to 22:55 NPT (UTC+5:45).
    # Sleeps 23:00-05:00 NPT so the free instance saves ~6h of the 750 monthly hours.
    - '15,25,35,45,55 23 * * *'
    - '*/10 0-16 * * *'
    - '0,10 17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        continue-on-error: true
        run: |
          curl -fsS --max-time 100 \
            https://reflickmovies-api.onrender.com/api/health || true
