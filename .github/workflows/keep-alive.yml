name: Keep Reflick awake

# Render's free plan spins a web service down after ~15 idle minutes; the next request then waits
# for a cold boot (30-60s) before it answers. Only the API sleeps - the web app is a static site -
# so this workflow wakes the API through the hours people use it, 05:00 to 23:00 Nepal time
# (UTC+5:45), and lets it rest from 23:00 to 05:00.
#
# Two timers point at the same health route:
#
#   * cron-job.org is the primary one. It fires every 10 minutes and, unlike GitHub's scheduler,
#     does so on time. Nothing here affects it.
#   * This workflow is the free backstop. On a PUBLIC repository, standard runner minutes are free,
#     so the frequent tick is affordable again; its job is to cover the windows when GitHub's own
#     scheduler runs late - it is best-effort, worst at the top of the hour - and cron-job.org alone
#     would have let the service fall asleep.
#
# The repository must stay public for that to hold. On a private repository the 2,000 metered
# minutes/month cannot cover a 10-minute tick (~3,200), the account runs dry mid-cycle and scheduled
# runs stop firing - which is exactly what looked like "irregular, then does nothing at all". If the
# repository ever goes private again, lower the cadence to every 30 minutes.
#
# UTC translations of the Nepal-time window:
#   05:00 NPT = 23:15 UTC (previous day)
#   23:00 NPT = 17:15 UTC
on:
  schedule:
    # 05:00-05:55 NPT
    - cron: '15,25,35,45,55 23 * * *'
    # 05:45-22:35 NPT (the following UTC day)
    - cron: '*/10 0-16 * * *'
    # 22:45-22:55 NPT
    - cron: '0,10 17 * * *'
  workflow_dispatch:

# Never run two warm-ups at once. Cancelling the older run rather than queueing behind it matters:
# a queued tick lands even later, which is exactly when the API can have fallen asleep.
concurrency:
  group: keep-alive
  cancel-in-progress: true

env:
  API_URL: https://reflickmovies-api.onrender.com

jobs:
  # One job, one service. The web app is static and never sleeps, so checking it on every tick was
  # busy-work; the API's health route is the only thing that needs waking.
  keep-warm:
    name: Wake the API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The sleep window is enforced here, in the runner's own clock, so the schedule above is a
      # hint and this is the rule: outside 05:00-23:00 Nepal time the run stops without touching
      # the service. `workflow_dispatch` is subject to the same rule.
      - name: Respect the 23:00-05:00 rest window
        id: window
        run: |
          set -eu
          hour=$(TZ="Asia/Kathmandu" date +%-H)
          echo "Nepal time now: $(TZ='Asia/Kathmandu' date '+%F %H:%M')"
          if [ "$hour" -ge 23 ] || [ "$hour" -lt 5 ]; then
            echo "asleep=true" >> "$GITHUB_OUTPUT"
            echo "Outside waking hours; letting the API rest."
          else
            echo "asleep=false" >> "$GITHUB_OUTPUT"
          fi

      # A cold Render container holds the connection open until it is ready, so the first attempt
      # often blocks for 30-60s and then succeeds. `--retry` with `--retry-all-errors` covers the
      # 502/504 during boot and a network hiccup, without the old 12 x 15s loop that held the
      # concurrency lock for minutes and starved the next tick.
      - name: Wake and confirm the API
        if: steps.window.outputs.asleep == 'false'
        run: |
          set -u
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --retry 5 --retry-delay 10 --retry-all-errors --max-time 90 \
            "$API_URL/api/health" || echo 000)
          echo "/api/health -> HTTP $code"
          cat /tmp/health.json || true
          test "$code" = "200"
