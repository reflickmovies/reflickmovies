services:
  - type: web
    name: reflick-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://reflickmovies-api.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://reflickmovies-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: autoplay=(self), fullscreen=(self), picture-in-picture=(), camera=(), microphone=(), geolocation=(), clipboard-read=(), clipboard-write=()
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
