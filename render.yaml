services:
  - type: web
    name: reflick-api
    env: node
    plan: free
    rootDir: apps/server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: WEB_ORIGIN
        value: https://www.reflickmovies.linkpc.net,https://reflickmovies-web.onrender.com,https://reflick-web.onrender.com
      - key: MONGODB_DB_NAME
        value: reflick
      - key: TMDB_LANG
        value: en-US
      - key: SYNC_ENABLED
        value: false
      # Generated once by Render and kept stable: rotating it invalidates every session, which is
      # the intended blast radius. Without this the API would fall back to the public dev default.
      - key: AUTH_SECRET
        generateValue: true
  - type: web
    name: reflick-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://reflickmovies-api.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://reflickmovies-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: autoplay=(self), fullscreen=(self), picture-in-picture=(), camera=(), microphone=(), geolocation=(), clipboard-read=(), clipboard-write=()
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'