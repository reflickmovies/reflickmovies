<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Reflick</title>
    <link rel="icon" type="image/svg+xml" href="/reflick-logo.svg" />
    <meta
      name="description"
      content="Reflick is a monochrome streaming catalogue. Films and series, handpicked and in one place."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://www.reflickmovies.linkpc.net/" />

    <!-- Social cards. Kept in step with lib/seo.ts, which updates these per route. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reflick" />
    <meta property="og:title" content="Reflick — films and series in one place" />
    <meta
      property="og:description"
      content="Reflick is a monochrome streaming catalogue. Films and series, handpicked and in one place."
    />
    <meta property="og:url" content="https://www.reflickmovies.linkpc.net/" />
    <meta property="og:image" content="https://www.reflickmovies.linkpc.net/reflick-logo.svg" />
    <meta property="og:image:alt" content="Reflick" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reflick — films and series in one place" />
    <meta
      name="twitter:description"
      content="Reflick is a monochrome streaming catalogue. Films and series, handpicked and in one place."
    />
    <meta name="twitter:image" content="https://www.reflickmovies.linkpc.net/reflick-logo.svg" />

    <script type="application/ld+json" data-reflick-jsonld>
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.reflickmovies.linkpc.net/#website",
            "name": "Reflick",
            "url": "https://www.reflickmovies.linkpc.net",
            "description": "Reflick is a monochrome streaming catalogue. Films and series, handpicked and in one place.",
            "inLanguage": "en",
            "publisher": { "@id": "https://www.reflickmovies.linkpc.net/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.reflickmovies.linkpc.net/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://www.reflickmovies.linkpc.net/#organization",
            "name": "Reflick",
            "url": "https://www.reflickmovies.linkpc.net",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.reflickmovies.linkpc.net/reflick-logo.svg"
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
